[pycodestyle]
max-line-length = 99
# E501: remaining long lines are CSS/HTML strings that cannot be wrapped
# E402: sys.path manipulation before imports is intentional in entry-point scripts
# W503: black puts line breaks before binary operators (intentional)
# E704: abstract stubs with `...` on same line — black's preferred style
# E501/E402: long CSS strings and sys.path-before-import pattern
ignore = E501,E402,W503,E704

[isort]
profile = black
line_length = 88
known_first_party = src,app

[tool:pytest]
testpaths = tests
